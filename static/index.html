<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HN Hiring Tracker</title>
<style>
  :root {
    --bg: #11141a; --panel: #1a1f29; --panel2: #222937; --border: #2e3848;
    --text: #d8dee9; --dim: #8b97a8; --accent: #ff9c41; --accent2: #5ec2ff;
    --good: #5fd38a; --bad: #ff7a7a; --star: #ffd166;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  a { color: var(--accent2); text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { position: sticky; top: 0; z-index: 10; background: var(--panel);
           border-bottom: 1px solid var(--border); padding: 12px 20px; }
  .bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
         max-width: 1100px; margin: 0 auto; }
  .bar h1 { font-size: 17px; margin: 0; color: var(--accent); white-space: nowrap; }
  .bar .meta { color: var(--dim); font-size: 12.5px; }
  .search-wrap { flex: 1; min-width: 220px; position: relative; display: flex; }
  #search { flex: 1; background: var(--bg); color: var(--text);
            border: 1px solid var(--border); border-radius: 8px; padding: 8px 32px 8px 12px; font-size: 14px; }
  #search:focus { outline: none; border-color: var(--accent2); }
  #search::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
  #search-clear { position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
                  background: none; border: none; border-radius: 50%; padding: 0;
                  width: 22px; height: 22px; line-height: 1; font-size: 18px;
                  color: var(--dim); cursor: pointer; }
  #search-clear:hover { color: var(--text); border: none; }
  button { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 7px 14px; font-size: 13.5px; cursor: pointer; }
  button:hover { border-color: var(--accent2); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #18120a; font-weight: 600; }

  .filters { display: flex; gap: 8px; flex-wrap: wrap; max-width: 1100px;
             margin: 10px auto 0; }
  .chip { border-radius: 999px; padding: 5px 13px; font-size: 13px; }
  .chip.on { background: var(--accent2); border-color: var(--accent2); color: #0b1620; font-weight: 600; }

  .tabs { display: flex; gap: 2px; flex-wrap: wrap; max-width: 1100px; margin: 10px auto 0; }
  .tab { border: none; border-bottom: 2px solid transparent; background: none;
         border-radius: 0; padding: 5px 11px; color: var(--dim); }
  .tab.on { color: var(--text); border-bottom-color: var(--accent); }
  .tab .n { color: var(--dim); font-size: 11.5px; margin-left: 4px; }

  main { max-width: 1100px; margin: 18px auto; padding: 0 20px; }
  #count { color: var(--dim); font-size: 13px; margin-bottom: 10px; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
          padding: 14px 16px; margin-bottom: 12px; }
  .card.fav { border-left: 3px solid var(--star); }
  .card.archived { opacity: .5; }
  .card-head { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
  .card-title { flex: 1; font-weight: 600; font-size: 14.5px; }
  .acts { display: flex; gap: 2px; align-items: center; }
  .star { background: none; border: none; font-size: 19px; padding: 0 4px; color: var(--dim); }
  .star.on { color: var(--star); }
  .act { background: none; border: 1px solid var(--border); border-radius: 8px;
         width: 30px; height: 30px; padding: 0; font-size: 17px; line-height: 1;
         color: var(--dim); }
  .act.plus:hover { color: var(--good); border-color: var(--good); }
  .act.x:hover { color: var(--bad); border-color: var(--bad); }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px;
           background: var(--panel2); color: var(--dim); border: 1px solid var(--border); }
  .badge.remote { color: var(--good); border-color: var(--good); }
  .badge.us { color: var(--accent2); border-color: var(--accent2); }
  .badge.swiss { color: var(--accent); border-color: var(--accent); }
  .card-meta { color: var(--dim); font-size: 12px; margin-top: 6px; }
  .status-pill { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 8px;
                 background: var(--panel2); border: 1px solid var(--border); color: var(--accent2); }
  .status-pill.due { color: var(--bad); border-color: var(--bad); }
  .chip.due { color: var(--bad); border-color: var(--bad); }
  .chip.due.on { background: var(--bad); border-color: var(--bad); color: #1a0c0c; }
  .remind-btn { color: var(--bad); border-color: var(--bad); }

  .card-body { display: none; margin-top: 12px; border-top: 1px solid var(--border); padding-top: 12px; }
  .card.open .card-body { display: block; }
  .post { font-size: 14px; overflow-wrap: anywhere; }
  .post a:focus { outline: 2px solid var(--accent2); outline-offset: 2px; border-radius: 2px; }
  .post p { margin: 8px 0; }
  .controls { display: flex; gap: 10px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
  select { background: var(--panel2); color: var(--text); border: 1px solid var(--border);
           border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  textarea { width: 100%; min-height: 70px; margin-top: 10px; background: var(--bg);
             color: var(--text); border: 1px solid var(--border); border-radius: 8px;
             padding: 9px 12px; font: 13.5px/1.5 inherit; resize: vertical; }
  textarea:focus { outline: none; border-color: var(--accent2); }
  .saved { color: var(--good); font-size: 12px; opacity: 0; transition: opacity .3s; }
  .saved.show { opacity: 1; }
  .empty { color: var(--dim); text-align: center; padding: 60px 0; }

  #apply-modal { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55);
                 display: flex; align-items: stretch; justify-content: center; gap: 14px;
                 padding: 4vh 20px; }
  #apply-modal[hidden] { display: none; }  /* display:flex above would otherwise defeat `hidden` */
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
                padding: 18px 20px; width: 620px; max-width: 100%; height: 92vh;
                display: flex; flex-direction: column; gap: 10px; }
  .modal-job { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
               padding: 18px 20px; width: 520px; height: 92vh; overflow-y: auto; }
  .modal-job h3 { margin: 0; font-size: 14.5px; }
  @media (max-width: 1200px) { .modal-job { display: none; } }  /* narrow screens: compose only */
  .modal-card h2 { margin: 0; font-size: 15px; color: var(--accent); }
  .modal-card label { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dim); }
  .modal-card input { flex: 1; background: var(--bg); color: var(--text); border: 1px solid var(--border);
                      border-radius: 8px; padding: 7px 11px; font-size: 13.5px; }
  .modal-card input:focus { outline: none; border-color: var(--accent2); }
  .modal-card select { flex: 1; }
  #apply-body { min-height: 220px; margin-top: 0; flex: 1; }
  .modal-foot { display: flex; gap: 10px; align-items: center; }
  .modal-foot .attach { color: var(--dim); font-size: 12.5px; margin-right: auto; }

  #zen-btn.on { background: var(--accent2); border-color: var(--accent2); color: #0b1620; font-weight: 600; }
  body.zen header { display: none; }  /* zen = no nav chrome, just the card and hotkeys */
  .zen-bar { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
  .zen-pos { font-weight: 600; min-width: 80px; text-align: center; font-variant-numeric: tabular-nums; }
  .zen-keys { color: var(--dim); font-size: 12px; margin-left: auto; }
  .zen-keys kbd { background: var(--panel2); border: 1px solid var(--border); border-radius: 4px;
                  padding: 1px 5px; font-size: 11px; font-family: inherit; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <h1>HN Hiring</h1>
    <span class="meta" id="thread-meta">no data yet — hit Sync</span>
    <select id="month-select" title="Switch month" hidden></select>
    <button id="followup-elsewhere" class="chip due" hidden
            title="Follow-ups due in months you're not viewing — click to jump there"></button>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="Search company, tech, keywords…">
      <button id="search-clear" type="button" title="Clear search" hidden>×</button>
    </div>
    <button id="zen-btn" title="One card at a time (z)">Zen</button>
    <button class="primary" id="sync-btn">Sync</button>
  </div>
  <div class="filters" id="filters">
    <button class="chip" data-f="remote">Remote</button>
    <button class="chip" data-f="us">US-based</button>
    <button class="chip" data-f="swiss">Swiss-friendly</button>
    <button class="chip" data-f="fav">★ Favorites</button>
    <button class="chip" data-f="noted">Has notes</button>
    <button class="chip" data-f="followup" id="chip-followup" title="Emailed applications gone quiet past 7 days">↻ Follow-up</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<main>
  <div id="count"></div>
  <div id="list"></div>
</main>

<div id="apply-modal" hidden>
  <div class="modal-card"><!-- compose: left -->
    <h2 id="apply-title">Apply via email</h2>
    <label>To <input id="apply-to" type="email"></label>
    <label>Subject <input id="apply-subject"></label>
    <label>Pitch <select id="apply-pitch"></select></label>
    <textarea id="apply-body" spellcheck="true"></textarea>
    <div class="modal-foot">
      <span class="attach" id="apply-attach">📎 resume attached · [text](url) → hyperlink</span>
      <button id="apply-test" title="Send this email to echarris@smcm.edu for a sanity check — no status change">Test</button>
      <button id="apply-cancel">Cancel</button>
      <button class="primary" id="apply-send">Send</button>
    </div>
  </div>
  <div class="modal-job" id="apply-job"><!-- job details: right --></div>
</div>

<script>
const STATUSES = ["all", "inbox", "interested", "later", "applied", "interviewing", "offer", "rejected", "archived"];
// Cards are expanded by default; `closed` remembers ones the user collapsed.
// Zen mode shows one card at a time from the current filtered list.
const state = { jobs: [], threads: [], thread: null, threadId: null, q: "", filters: new Set(),
                tab: "all", closed: new Set(), zen: false, zenIdx: 0 };

// + bumps a post one step along the review pipeline; "later" is a parking lot
// that re-enters at interested.
const NEXT_STAGE = { inbox: "interested", interested: "applied", later: "interested",
                     applied: "interviewing", interviewing: "offer" };

// Bumping into "applied" without the email flow means a web portal: no follow-up
// needed, unlike applied_via=email (set by the apply endpoint).
function bumpFields(j) {
  const status = NEXT_STAGE[j.status] || j.status;
  const fields = { status };
  if (status === "applied" && j.status !== "applied" && !j.applied_via) fields.applied_via = "portal";
  return fields;
}

const $ = s => document.querySelector(s);
const esc = s => { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; };
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

// Posts that list an email address get an "✉ Apply" button (URL-only posts stay manual).
// Handles literal addresses plus scraper-dodging forms: "nesra at roundlyhq.com",
// "jobs [at] foo [dot] com". STOP_LOCAL keeps prose like "more info at example.com"
// from matching; worst case the To field is editable anyway. Cached per job.
const STOP_LOCAL = new Set(["apply", "us", "info", "more", "available", "details", "here",
                            "team", "page", "website", "site", "online", "found", "work",
                            "role", "position", "openings", "listed", "posted", "live", "out"]);
function emailsIn(j) {
  if (!j._emails) {
    const d = document.createElement("div");
    d.innerHTML = j.text;
    const text = d.textContent;
    const found = text.match(/[\w.+-]+@[\w-]+(?:\.[\w-]+)+/g) || [];
    const ob = /\b([\w.+-]{2,})\s*(?:\[\s*at\s*\]|\(\s*at\s*\)|\s+at\s+)\s*([\w-]+(?:(?:\s*\[\s*dot\s*\]\s*|\s*\(\s*dot\s*\)\s*|\s+dot\s+|\.)[\w-]+)+)(?![\w-]*@)/gi;
    for (let m; (m = ob.exec(text)); ) {
      const local = m[1];
      const domain = m[2].replace(/\s*(?:\[\s*dot\s*\]|\(\s*dot\s*\)|\s+dot\s+)\s*/gi, ".").replace(/\s+/g, "");
      if (STOP_LOCAL.has(local.toLowerCase()) || !/\.[a-z]{2,}$/i.test(domain)) continue;
      found.push(`${local}@${domain}`);
    }
    j._emails = [...new Set(found)];
  }
  return j._emails;
}

// HN convention: "Company | Role | Location | …"
const titleParts = j => j.title.split("|").map(s => s.trim());

// "About me" variants distilled from real applications sent June 2026 — pick
// per company in the modal; edit the texts here as the pitch evolves.
const PITCHES = {
  // First entry is the default selection in the compose modal.
  fullstack: {
    label: "AI-forward full-stack",
    text: `While I have 10,000+ hours programming by hand in TypeScript, Golang, and JavaScript, more and more of my time looks like 6+ terminals running Claude Code to ship evaluations, agent systems to HIPAA production systems, and automate TOIL for my company.

I resonate with Andrej Karpathy's goal of not writing another line of code by hand. Although I still use nano / vim to edit .env files from time to time.`,
  },
  medtech: {
    label: "HIPAA / medtech",
    text: `I am a software engineer with HIPAA experience from my current medtech company, and a lot of time spent in Cloudwatch logs and Grafana. The HIPAA space gets all the more interesting as I deploy more and more AI agents.`,
  },
  safety: {
    label: "AI safety / research",
    text: `I am heavily invested in AI Safety, AI Security, and understanding a path forward to reduce Global Catastrophic Risk stemming from advanced AI systems. I have been leading a Supervised Program for Alignment Research team for the past few months. See the Results section of [the poster](https://evanharris.dev/presentations/disentangling-self-preservation/). I want to build agents, harnesses, and experimental setups to understand drift and risk from long-running agents.`,
  },
  show: {
    label: "Show, don't tell",
    text: `Want to see what I have built rather than listen to me tell you about it?`,
  },
};

// "sid@augusthealth.com" → "Sid"; role addresses ("careers@", "jobs@") → "there".
const GENERIC_LOCAL = new Set(["careers", "jobs", "info", "hiring", "hello", "contact",
                               "team", "talent", "recruiting", "recruitment", "hr",
                               "apply", "work", "join", "mail", "admin", "office"]);
function greetName(to) {
  const first = (to.split("@")[0] || "").split("+")[0].split(/[._-]/)[0];
  if (!/^[a-z]+$/i.test(first) || GENERIC_LOCAL.has(first.toLowerCase())) return "there";
  return first[0].toUpperCase() + first.slice(1).toLowerCase();
}

function applyTemplate(j, pitchKey, to) {
  const day = new Date().toLocaleDateString("en-US", { weekday: "long" });
  const month = (state.thread?.title.match(/\(([^)]+)\)/) || [])[1];
  return `Hi ${greetName(to)},

Happy ${day}.

Ran across your post on the HN Who's Hiring thread${month ? ` for ${month.split(" ")[0]}` : ""}.

${PITCHES[pitchKey].text}

Checkout my [personal website](https://evanharris.dev/) or my attached resume for more details.

Best,
Evan`;
}

// Apply only makes sense before an application exists (and with an email to send to).
const canApply = j => ["inbox", "interested", "later"].includes(j.status) && emailsIn(j).length > 0;

// ---- follow-up: email applications that have gone quiet ----
// applied_at / reminded_at are unix seconds stamped server-side (db.py). A post is
// "follow-up due" once an emailed application has sat in `applied` past the window
// with no reminder yet. Derived in the frontend, like Swiss-friendly — nothing stored.
const FOLLOWUP_DAYS = 7;
const DAY = 86400;
const nowSec = () => Math.floor(Date.now() / 1000);
const daysSince = ts => Math.floor((nowSec() - ts) / DAY);
const followupDue = j => j.status === "applied" && j.applied_via === "email"
  && j.applied_at && !j.reminded_at && (nowSec() - j.applied_at) >= FOLLOWUP_DAYS * DAY;
// The exact address applied to lives in the "✉ applied … → addr" audit line; fall
// back to the first address scraped from the post.
function appliedToAddr(j) {
  const m = (j.notes || "").match(/✉ applied \d{4}-\d{2}-\d{2} → (\S+@\S+)/);
  return (m && m[1]) || emailsIn(j)[0] || "";
}

const isRemote = j => j.tags.includes("remote");
const isUS = j => j.tags.includes("us");
const isSwiss = j => j.tags.includes("switzerland") ||
  (isRemote(j) && (j.tags.includes("europe") || j.tags.includes("worldwide")));

// HN title → short month label: "Ask HN: Who is hiring? (June 2026)" → "June 2026".
const monthLabel = t => (t.title.match(/\(([^)]+)\)/) || [])[1] || t.title;

// The month picker plus its cross-month follow-up cue. Browsing stays per-month; the
// only signal that crosses months is followup_due (server-computed in /api/threads),
// so an application maturing after a rollover stays visible from the default view.
function renderMonthPicker() {
  const sel = $("#month-select");
  if (!state.threads.length) {
    sel.hidden = true;
  } else {
    sel.hidden = false;
    sel.disabled = state.threads.length < 2;  // single month: show it, but no false choice
    sel.innerHTML = state.threads.map(t => {
      const due = t.followup_due ? ` · ↻${t.followup_due}` : "";
      return `<option value="${t.id}" ${t.id === state.threadId ? "selected" : ""}>${esc(monthLabel(t))} · ${t.job_count}${due}</option>`;
    }).join("");
  }
  // Always-visible cue: follow-ups due in months OTHER than the one in view (the
  // current month's are already on the in-card ↻ chip). Hidden when none.
  const elsewhere = state.threads
    .filter(t => t.id !== state.threadId)
    .reduce((n, t) => n + (t.followup_due || 0), 0);
  const btn = $("#followup-elsewhere");
  btn.hidden = !elsewhere;
  btn.textContent = elsewhere ? `↻ ${elsewhere} due in other months` : "";
}

// threadId optional: absent/null → newest month (initial load + R5 back-compat). Fetches
// the month list every time so the picker stays correct after a sync, no extra bookkeeping.
async function load(threadId) {
  const [threads, data] = await Promise.all([
    fetch("/api/threads").then(r => r.json()),
    fetch("/api/jobs" + (threadId ? `?thread_id=${threadId}` : "")).then(r => r.json()),
  ]);
  state.threads = threads;
  state.jobs = data.jobs;
  state.thread = data.thread;
  state.threadId = state.thread ? state.thread.id : null;
  if (state.thread) {
    const d = new Date(state.thread.last_synced * 1000);
    $("#thread-meta").textContent =
      `${state.thread.title} · ${state.jobs.length} posts · synced ${d.toLocaleString()}`;
  } else {
    $("#thread-meta").textContent = "no data yet — hit Sync";
  }
  renderMonthPicker();
  render();
}

async function sync() {
  const btn = $("#sync-btn");
  btn.disabled = true; btn.textContent = "Syncing…";
  try {
    const r = await fetch("/api/sync", { method: "POST" });
    if (!r.ok) throw new Error(await r.text());
    await load();
  } catch (e) {
    alert("Sync failed: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Sync";
  }
}

async function patch(id, fields) {
  await fetch(`/api/jobs/${id}`, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(fields),
  });
  const j = state.jobs.find(j => j.id === id);
  Object.assign(j, fields);
}

function visible() {
  const q = state.q.toLowerCase();
  return state.jobs.filter(j => {
    if (state.tab !== "all" && j.status !== state.tab) return false;
    if (state.filters.has("remote") && !isRemote(j)) return false;
    if (state.filters.has("us") && !isUS(j)) return false;
    if (state.filters.has("swiss") && !isSwiss(j)) return false;
    if (state.filters.has("fav") && !j.favorite) return false;
    if (state.filters.has("noted") && !j.notes.trim()) return false;
    if (state.filters.has("followup") && !followupDue(j)) return false;
    if (q && !(j.text.toLowerCase().includes(q) || j.author.toLowerCase().includes(q)
               || j.notes.toLowerCase().includes(q))) return false;
    return true;
  });
}

function renderTabs() {
  const counts = {};
  for (const j of state.jobs) counts[j.status] = (counts[j.status] || 0) + 1;
  counts.all = state.jobs.length;
  $("#tabs").innerHTML = STATUSES.map(s =>
    `<button class="tab ${state.tab === s ? "on" : ""}" data-tab="${s}">
       ${s[0].toUpperCase() + s.slice(1)}<span class="n">${counts[s] || 0}</span>
     </button>`).join("");
}

function badgesFor(j) {
  const b = [];
  if (isRemote(j)) b.push('<span class="badge remote">remote</span>');
  if (j.tags.includes("onsite")) b.push('<span class="badge">onsite/hybrid</span>');
  if (isUS(j)) b.push('<span class="badge us">US</span>');
  if (j.tags.includes("switzerland")) b.push('<span class="badge swiss">Switzerland</span>');
  else if (isSwiss(j)) b.push('<span class="badge swiss">Swiss-friendly</span>');
  if (j.tags.includes("europe")) b.push('<span class="badge">Europe</span>');
  if (j.tags.includes("worldwide")) b.push('<span class="badge">worldwide</span>');
  return b.join("");
}

// Lifecycle pill for applications: due-for-follow-up (warning), already-reminded,
// or just the age since applying. Empty for everything pre-application.
function followupPill(j) {
  if (followupDue(j))
    return `<span class="status-pill due">↻ follow up · applied ${daysSince(j.applied_at)}d ago</span>`;
  if (j.reminded_at)
    return `<span class="status-pill">↻ reminded ${daysSince(j.reminded_at)}d ago</span>`;
  if (j.status === "applied" && j.applied_at)
    return `<span class="status-pill">applied ${daysSince(j.applied_at)}d ago</span>`;
  return "";
}

function cardHTML(j, forceOpen = false) {
  return `
    <div class="card ${j.favorite ? "fav" : ""} ${j.status === "archived" ? "archived" : ""} ${forceOpen || !state.closed.has(j.id) ? "open" : ""}" data-id="${j.id}">
      <div class="card-head">
        <div style="flex:1">
          <div class="card-title">${esc(j.title)}</div>
          <div class="badges">${badgesFor(j)}</div>
          <div class="card-meta">
            ${esc(j.author)} · ${new Date(j.time * 1000).toLocaleDateString()}
            · <a href="https://news.ycombinator.com/item?id=${j.id}" target="_blank" rel="noopener">HN ↗</a>
            ${j.status !== "inbox" ? `<span class="status-pill">${j.status}</span>` : ""}
            ${j.applied_via ? `<span class="status-pill">${j.applied_via === "email" ? "✉ email" : "🔗 portal"}</span>` : ""}
            ${followupPill(j)}
            ${j.notes.trim() ? `<span class="status-pill">📝</span>` : ""}
          </div>
        </div>
        <div class="acts">
          <button class="star ${j.favorite ? "on" : ""}" title="Favorite">★</button>
          ${NEXT_STAGE[j.status] ? `<button class="act plus" title="Bump to ${NEXT_STAGE[j.status]}">+</button>` : ""}
          <button class="act x" title="${j.status === "archived" ? "Restore to inbox" : "Archive"}">×</button>
        </div>
      </div>
      <div class="card-body">
        <div class="post">${j.text}</div>
        <div class="controls">
          <label>Status:
            <select class="status-sel">
              ${STATUSES.slice(1).map(s =>
                `<option value="${s}" ${j.status === s ? "selected" : ""}>${s}</option>`).join("")}
            </select>
          </label>
          ${canApply(j) ? `<button class="apply-btn" title="Email an application, resume attached">✉ Apply</button>` : ""}
          ${followupDue(j) ? `<button class="remind-btn" title="Send a follow-up reminder, resume re-attached">↻ Send reminder</button>` : ""}
          <span class="saved">saved ✓</span>
        </div>
        <textarea class="notes" placeholder="Notes — contacts, application date, follow-ups…">${esc(j.notes)}</textarea>
      </div>
    </div>`;
}

function render() {
  renderTabs();
  // Surface the follow-up count right on the chip — it's the actionable one.
  const dueCount = state.jobs.filter(followupDue).length;
  const chip = $("#chip-followup");
  chip.textContent = dueCount ? `↻ Follow-up (${dueCount})` : "↻ Follow-up";
  chip.classList.toggle("due", dueCount > 0);
  const jobs = visible();
  state.zenIdx = Math.max(0, Math.min(state.zenIdx, jobs.length - 1));
  if (state.zen) {
    const j = jobs[state.zenIdx];
    $("#count").textContent = "";
    $("#list").innerHTML = `
      <div class="zen-bar">
        <button id="zen-prev" ${state.zenIdx <= 0 ? "disabled" : ""}>←</button>
        <span class="zen-pos">${jobs.length ? state.zenIdx + 1 : 0} / ${jobs.length}</span>
        <button id="zen-next" ${state.zenIdx >= jobs.length - 1 ? "disabled" : ""}>→</button>
        <span class="zen-keys">
          <kbd>←</kbd><kbd>→</kbd> move · <kbd>+</kbd> bump · <kbd>x</kbd> archive ·
          <kbd>f</kbd> fav · <kbd>l</kbd> later · <kbd>r</kbd> reject · <kbd>a</kbd> apply/remind · <kbd>i</kbd> interested tab · <kbd>n</kbd> notes · <kbd>z</kbd>/<kbd>Esc</kbd> exit
        </span>
      </div>` +
      (j ? cardHTML(j, true) : '<div class="empty">Nothing matches the current filters.</div>');
  } else {
    $("#count").textContent = `${jobs.length} of ${state.jobs.length} posts`;
    $("#list").innerHTML = jobs.length ? jobs.map(j => cardHTML(j)).join("")
      : '<div class="empty">Nothing matches. Try clearing filters, or hit Sync.</div>';
  }
  // Post bodies are raw HN HTML — make their links open in a new tab.
  for (const a of document.querySelectorAll("#list .post a")) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  // Zen: Tab cycles through the post's links only — buttons/selects/notes drop
  // out of the tab order (they keep their hotkeys: +, x, f, n).
  if (state.zen) {
    for (const el of document.querySelectorAll("#list button, #list select, #list textarea, #list .card-meta a"))
      el.tabIndex = -1;
  }
}

function toggleZen() {
  state.zen = !state.zen;
  $("#zen-btn").classList.toggle("on", state.zen);
  document.body.classList.toggle("zen", state.zen);
  window.scrollTo(0, 0);
  render();
}

// After + / × in zen mode, move to the next card. If the acted card left the
// filtered list (e.g. archived while on the Inbox tab), the same index already
// points at the next card; otherwise step past it. render() clamps the index.
function zenStep(actedId) {
  if (!state.zen) return;
  if (visible()[state.zenIdx]?.id === actedId) state.zenIdx++;
}

// ---- apply-by-email modal ----
// The same compose modal serves two jobs: a fresh application ('application') and
// a follow-up nudge ('reminder'). composeKind decides the template, the pitch row's
// visibility, and what the send does on success.
let applyJobId = null;
let composeKind = "application";

$("#apply-pitch").innerHTML = Object.entries(PITCHES).map(([k, p]) =>
  `<option value="${k}">${p.label}</option>`).join("");

// Reminder body: short, references how long it's been, re-attaches the resume. No
// pitch — this is a nudge, not a re-pitch.
function reminderTemplate(j, to) {
  const days = j.applied_at ? daysSince(j.applied_at) : 0;
  const when = j.applied_at ? new Date(j.applied_at * 1000).toLocaleDateString() : "recently";
  const [company] = titleParts(j);
  return `Hi ${greetName(to)},

I'm following up on my application${company ? ` to ${company}` : ""}, sent on ${when} (${days} day${days === 1 ? "" : "s"} ago) in response to your HN Who's Hiring post.

I'm still very interested and wanted to make sure it reached you. I'd be glad to share more or answer any questions.

I've re-attached my resume for convenience — more at my [personal website](https://evanharris.dev/).

Best,
Evan`;
}

function openApply(j) {
  composeKind = "application";
  applyJobId = j.id;
  const [company, role] = titleParts(j);
  $("#apply-pitch").closest("label").style.display = "";
  $("#apply-title").textContent = `Apply — ${company || j.title}`;
  $("#apply-to").value = emailsIn(j)[0] || "";
  $("#apply-subject").value = role ? `HN Who's Hiring: ${role}` : `HN Who's Hiring: ${j.title}`;
  $("#apply-body").value = applyTemplate(j, $("#apply-pitch").value, $("#apply-to").value);
  fillApplyJobPanel(j);
}

function openReminder(j) {
  composeKind = "reminder";
  applyJobId = j.id;
  const [company, role] = titleParts(j);
  const to = appliedToAddr(j);
  $("#apply-pitch").closest("label").style.display = "none";  // nudge, no re-pitch
  $("#apply-title").textContent = `Follow up — ${company || j.title}`;
  $("#apply-to").value = to;
  $("#apply-subject").value = role ? `Following up: ${role}` : "Following up on my application";
  $("#apply-body").value = reminderTemplate(j, to);
  fillApplyJobPanel(j);
}

function fillApplyJobPanel(j) {
  $("#apply-job").innerHTML = `
    <h3>${esc(j.title)}</h3>
    <div class="badges">${badgesFor(j)}</div>
    <div class="card-meta">
      ${esc(j.author)} · ${new Date(j.time * 1000).toLocaleDateString()}
      · <a href="https://news.ycombinator.com/item?id=${j.id}" target="_blank" rel="noopener">HN ↗</a>
    </div>
    <div class="post" style="margin-top:12px">${j.text}</div>`;
  for (const a of document.querySelectorAll("#apply-job .post a")) {
    a.target = "_blank";
    a.rel = "noopener";
  }
  $("#apply-modal").hidden = false;
  $("#apply-body").focus();
}

// Switching pitch rebuilds the body from the template (drops manual edits).
$("#apply-pitch").addEventListener("change", () => {
  if (composeKind !== "application") return;
  const j = state.jobs.find(j => j.id === applyJobId);
  if (j) $("#apply-body").value = applyTemplate(j, $("#apply-pitch").value, $("#apply-to").value);
});

function closeApply() {
  $("#apply-modal").hidden = true;
  applyJobId = null;
}

async function sendApply(test = false) {
  const to = $("#apply-to").value.trim();
  const subject = $("#apply-subject").value.trim();
  const body = $("#apply-body").value;
  if (!to && !test) { alert("No recipient."); return; }
  if (!test && body.includes("EDIT ME") &&
      !confirm("The body still contains the [EDIT ME] placeholder — send anyway?")) return;

  const jobId = applyJobId;  // capture before closeApply() nulls it
  const kind = composeKind;  // capture too — he may open another compose mid-send
  const post = () => fetch(`/api/jobs/${jobId}/apply`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ to, subject, body, test, kind }),
  }).then(async r => {
    if (!r.ok) throw new Error((await r.json()).detail || r.statusText);
    return r.json();
  });

  if (test) {  // test stays in-modal with button feedback
    const btn = $("#apply-test");
    btn.disabled = true; btn.textContent = "Sending…";
    try {
      await post();
      btn.textContent = "Sent ✓";
      setTimeout(() => { btn.textContent = "Test"; }, 2000);
    } catch (e) {
      btn.textContent = "Test";
      alert("Test send failed: " + e.message);
    } finally {
      btn.disabled = false;
    }
    return;
  }

  if (kind === "reminder") {  // nudge: optimistic, leaves status/applied_via/applied_at alone
    const j = state.jobs.find(j => j.id === jobId);
    const prevReminded = j.reminded_at, prevNotes = j.notes;
    j.reminded_at = nowSec();  // clears it from the follow-up bucket immediately
    closeApply();
    zenStep(jobId);
    render();
    try {
      const u = await post();
      Object.assign(j, { notes: u.notes, reminded_at: u.reminded_at });
      render();
    } catch (e) {
      j.reminded_at = prevReminded; j.notes = prevNotes;
      render();
      if ($("#apply-modal").hidden) {
        alert(`Reminder to ${to} failed: ${e.message}\n\nReopening your draft.`);
        openReminder(j);
        $("#apply-to").value = to;
        $("#apply-subject").value = subject;
        $("#apply-body").value = body;
      } else {
        alert(`Reminder to ${to} failed: ${e.message}\n\n"${j.title.slice(0, 60)}" is still due for follow-up.`);
      }
    }
    return;
  }

  // Real send: optimistic. Flip the card to applied and advance zen right away,
  // deliver in the background; a failure rolls the status back.
  const pitch = $("#apply-pitch").value;
  const j = state.jobs.find(j => j.id === jobId);
  const prevStatus = j.status, prevVia = j.applied_via;
  j.status = "applied";
  j.applied_via = "email";
  closeApply();
  zenStep(jobId);
  render();
  try {
    const u = await post();
    Object.assign(j, { status: u.status, notes: u.notes, applied_via: u.applied_via });
    render();
  } catch (e) {
    j.status = prevStatus;
    j.applied_via = prevVia;
    render();
    if ($("#apply-modal").hidden) {
      alert(`Send to ${to} failed: ${e.message}\n\nReopening your draft.`);
      openApply(j);
      $("#apply-pitch").value = pitch;
      $("#apply-to").value = to;
      $("#apply-subject").value = subject;
      $("#apply-body").value = body;
    } else {  // he's already composing the next one — don't clobber that draft
      alert(`Send to ${to} failed: ${e.message}\n\n"${j.title.slice(0, 60)}" is back in ${prevStatus}.`);
    }
  }
}

$("#apply-send").addEventListener("click", () => sendApply(false));
$("#apply-test").addEventListener("click", () => sendApply(true));

// In the body editor: Tab jumps to Send, Shift+Tab sends immediately.
$("#apply-body").addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  e.preventDefault();
  if (e.shiftKey) sendApply(false);
  else $("#apply-send").focus();
});
$("#apply-cancel").addEventListener("click", closeApply);
$("#apply-modal").addEventListener("click", e => { if (e.target.id === "apply-modal") closeApply(); });

// ---- events (delegated) ----
$("#list").addEventListener("click", async e => {
  if (e.target.closest("#zen-prev")) { state.zenIdx--; render(); return; }
  if (e.target.closest("#zen-next")) { state.zenIdx++; render(); return; }
  const card = e.target.closest(".card");
  if (!card) return;
  const id = +card.dataset.id;
  const j = state.jobs.find(j => j.id === id);
  if (e.target.closest(".star")) {
    await patch(id, { favorite: !j.favorite });
    render();
  } else if (e.target.closest(".apply-btn")) {
    openApply(j);
  } else if (e.target.closest(".remind-btn")) {
    openReminder(j);
  } else if (e.target.closest(".act.plus")) {
    await patch(id, bumpFields(j));
    zenStep(id);
    render();
  } else if (e.target.closest(".act.x")) {
    await patch(id, { status: j.status === "archived" ? "inbox" : "archived" });
    zenStep(id);
    render();
  } else if (!state.zen && e.target.closest(".card-head") && !e.target.closest("a")) {
    state.closed.has(id) ? state.closed.delete(id) : state.closed.add(id);
    card.classList.toggle("open");
  }
});

document.addEventListener("keydown", async e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.matches("input, textarea, select")) {
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (!$("#apply-modal").hidden) {           // modal owns the keyboard while open
    if (e.key === "Escape") closeApply();
    return;
  }
  if (e.key === "z") { toggleZen(); return; }
  if (e.key === "i") { state.tab = "interested"; state.zenIdx = 0; render(); return; }
  if (!state.zen) return;
  const jobs = visible();
  const j = jobs[state.zenIdx];
  if (e.key === "ArrowRight" || e.key === "j") {
    state.zenIdx = Math.min(state.zenIdx + 1, jobs.length - 1); render();
  } else if (e.key === "ArrowLeft" || e.key === "k") {
    state.zenIdx = Math.max(state.zenIdx - 1, 0); render();
  } else if (e.key === "Escape") {
    toggleZen();
  } else if (!j) {
    return;
  } else if (e.key === "+" || e.key === "=") {
    await patch(j.id, bumpFields(j));
    zenStep(j.id); render();
  } else if (e.key === "x") {
    await patch(j.id, { status: j.status === "archived" ? "inbox" : "archived" });
    zenStep(j.id); render();
  } else if (e.key === "f") {
    await patch(j.id, { favorite: !j.favorite }); render();
  } else if (e.key === "l") {
    await patch(j.id, { status: "later" });
    zenStep(j.id); render();
  } else if (e.key === "r") {
    await patch(j.id, { status: "rejected" });
    zenStep(j.id); render();
  } else if (e.key === "a" && canApply(j)) {
    e.preventDefault();  // don't let the "a" keystroke type into the focused body
    openApply(j);
  } else if (e.key === "a" && followupDue(j)) {
    e.preventDefault();  // applied cards can't Apply, so "a" nudges instead
    openReminder(j);
  } else if (e.key === "n") {
    e.preventDefault();
    $("#list .notes")?.focus();
  }
});

$("#list").addEventListener("change", async e => {
  const card = e.target.closest(".card");
  if (card && e.target.matches(".status-sel")) {
    await patch(+card.dataset.id, { status: e.target.value });
    flashSaved(card); renderTabs();
  }
});

const saveNotes = debounce(async (id, val, card) => {
  await patch(id, { notes: val });
  flashSaved(card);
}, 600);

$("#list").addEventListener("input", e => {
  const card = e.target.closest(".card");
  if (card && e.target.matches(".notes")) saveNotes(+card.dataset.id, e.target.value, card);
});

function flashSaved(card) {
  const el = card.querySelector(".saved");
  el.classList.add("show");
  setTimeout(() => el.classList.remove("show"), 1200);
}

$("#filters").addEventListener("click", e => {
  const chip = e.target.closest(".chip");
  if (!chip) return;
  const f = chip.dataset.f;
  state.filters.has(f) ? state.filters.delete(f) : state.filters.add(f);
  chip.classList.toggle("on");
  render();
});

$("#tabs").addEventListener("click", e => {
  const tab = e.target.closest(".tab");
  if (!tab) return;
  state.tab = tab.dataset.tab;
  render();
});

const toggleSearchClear = () => { $("#search-clear").hidden = !$("#search").value; };
const searchInput = debounce(v => { state.q = v; render(); }, 200);
$("#search").addEventListener("input", e => {
  toggleSearchClear();  // immediate, so the × tracks typing without the search debounce
  searchInput(e.target.value);
});
$("#search-clear").addEventListener("click", () => {
  const s = $("#search");
  s.value = ""; state.q = "";
  toggleSearchClear();
  s.focus();
  render();
});
$("#sync-btn").addEventListener("click", sync);
$("#zen-btn").addEventListener("click", toggleZen);
$("#month-select").addEventListener("change", e => {
  state.zenIdx = 0; state.closed.clear();  // different posts; persist filters/tab as the lens
  load(+e.target.value);
});
// Cross-month cue: jump to the most recent other month that has follow-ups due.
$("#followup-elsewhere").addEventListener("click", () => {
  const t = state.threads.find(t => t.id !== state.threadId && t.followup_due > 0);
  if (t) { state.zenIdx = 0; state.closed.clear(); load(t.id); }
});

load();
</script>
</body>
</html>
